<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
  <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D2B3F"/><stop offset="1" stop-color="#0C121C"/></linearGradient>
  <linearGradient id="road" gradientUnits="userSpaceOnUse" x1="0" y1="860" x2="0" y2="172"><stop offset="0" stop-color="#E8442E"/><stop offset="1" stop-color="#FFB15C"/></linearGradient>
</defs>
<rect x="100" y="114" width="824" height="824" rx="185" fill="#000" opacity=".35" filter="url(#drop)"/>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#tile)">
  <!-- the road: three legs and two hairpins, each leg climbing -->
  <path d="M150 800 L700 770 A120 120 0 0 0 700 530 L330 500 A120 120 0 0 1 330 260 L760 232" stroke="url(#road)" stroke-width="120" opacity=".45" filter="url(#glow)"/>
  <path d="M150 800 L700 770 A120 120 0 0 0 700 530 L330 500 A120 120 0 0 1 330 260 L760 232" stroke="url(#road)" stroke-width="120"/>
  <path d="M150 800 L700 770 A120 120 0 0 0 700 530 L330 500 A120 120 0 0 1 330 260 L760 232" stroke="#0C121C" stroke-width="10" stroke-dasharray="34 30" opacity=".55"/>
</g>
<!-- you, nearly at the top -->
<circle cx="760" cy="232" r="34" fill="#F7F7F2"/>
</svg>
